name: Compilar Lampião Hidden

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew build

      - name: Enviar JAR
        uses: actions/upload-artifact@v4
        with:
          name: lampiao-hidden
          path: build/libs/*.jar
